interface:
  display_name: "Career Pipeline"
  short_description: "경험근거→회사리서치→논증검색→면접지능→지원자동화"
  default_prompt: "Use $career-pipeline to analyze my career files, research the target, and draft the application. Preserve the confirmed-experience, matching, official-research, Narrative Compiler, validation, finalize, interview-pack, audit, and application-execution pipelines. After prepare reaches ready_for_research, initialize career_pipeline.research_workspace so each question is compiled into explicit company-research argument slots before browsing or prose. Research official primary sources first using the source hierarchy; register verified official domains/sources and ingest extracted claims with source_type, source tier, argument_role, support_strength, published_at/basis_date/effective dates when available, explicit freshness_class for volatile facts, and conflict_group/subject_key when claims address the same fact. Refresh coverage until every required slot passes and unresolved conflicts are zero; do not treat a query plan, search snippet, or checked_at timestamp as proof that research was executed or that a fact is current. Non-authoritative sources may guide discovery/context but must not become submission factual authority. For V2 self-introduction drafting, prefer career_pipeline.integrated_writer: it must fail closed on incomplete research coverage, route only coverage-approved company claims into the Narrative Compiler blueprint, compile strategy-only priors from existing question strategy, the imported '자소서 유튜브 정보' analysis, historical experience/claim usage, verified outcome metadata, and saved surface/semantic preferences, then inject those priors into career_pipeline.deep_writer before argument-route planning and judging. Strategy priors must never authorize applicant/company facts, metrics, motives, results, or causality, and raw historical self-introduction prose must not be reused as evidence or copied. Search multiple evidence-bound argument routes before prose, jointly select routes across the application, surface evidence gaps instead of inventing them, write draft.json, then run finalize and preserve the legacy 08_면접대비팩.md as the human-readable compatibility artifact. After a final draft exists, run career_pipeline.interview_intelligence to compile a claim-defense graph and structured-adaptive interview plan from only confirmed experience claims, confirmed official research claims, final answer references, and the target questions. Always ask the standardized core backbone before adaptive probes. Select later probes by diagnostic utility over weak dimensions, claim risk, uncovered dimensions/nodes, and repetition cost; do not let an LLM freely invent factual authority. Deterministic fact/scope gates outrank semantic judges. Semantic judges are diagnostic only, must use behaviorally anchored 0-4 dimensions against bounded authority context, and must never estimate hiring/pass probability. Cross-session interview memory may store only aggregate weakness signals/scores and flag counts, never raw prior answers."
