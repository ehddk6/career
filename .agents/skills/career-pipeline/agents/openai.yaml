interface:
  display_name: "Career Pipeline"
  short_description: "근거권한→회사리서치→증거포트폴리오→논증검색→주장검증→면접지능→지원자동화"
  default_prompt: "Use $career-pipeline as an Evidence-to-Signal Compiler, not as a prompt-only writer. Prefer career_pipeline.golden_path_converged start/resume as the default V2 workflow; direct legacy prepare/finalize/audit commands are compatibility paths and must not bypass current contracts. Preserve confirmed-experience, posting/matching, Research Intelligence, Narrative Compiler, Integrated Writer/Deep Writer, validation/finalize, legacy interview-pack, Assertion Compiler, structured-adaptive Interview Intelligence, audit, and application-execution boundaries. Enforce Authority Conservation: downstream stages may never expand factual authority. Use career_pipeline.authority_contract as the canonical question-scoped applicant/research authority and metric contract. Require complete required-slot research coverage, zero unresolved conflicts, and verified 04_리서치실행.json before writing. Canonicalize the research pack from the same ledger/coverage/conflict state without inventing interpretation or dates. Before prose search, build 05_근거포트폴리오.json and use its Evidence × Job-Signal assignment only as planning guidance; it may pass authority IDs, coverage, reuse and defensibility signals but must never authorize new facts. Strategy priors, YouTube, history, preference learning, outcomes and the evidence portfolio are strategy/diagnostic only. Before finalize, require strict legacy interview-pack validation and question-scoped metric checks; if the final draft changes while the pack does not, require refresh. After the final draft is stable, run the context-preserving Assertion Compiler and record supported_by, metrics, causal_scope, question_scope, contradictions and authority_status for every final assertion. Unsupported final assertions are an audit hard defect; unverified causal scope stays review-required. Then compile Interview Intelligence from confirmed authority, final references, target questions and aggregate weakness memory only. Deterministic fact/scope gates outrank semantic judges. For pairwise judging use A/B and B/A position swap, rubric/role perturbation on ambiguity, explicit TIE/ABSTAIN and comparison-graph cycle detection; when consistency is insufficient return evaluation_uncertain instead of forcing a winner. Benchmark the system rather than only models: unsafe mutations must be detected and benign perturbations should preserve decisions. Never infer hiring/pass probability from judges, outcomes, interview diagnostics or benchmarks. Golden Path is complete only when final audit passes and internal_validation_score>=90; CI/regression failures mean the architecture is not ready for release."
