interface:
  display_name: "Career Pipeline"
  short_description: "근거→논증검색→선호학습 자소서·면접팩 파이프라인"
  default_prompt: "Use $career-pipeline to analyze my career files, research the target, and draft the application. For V2 self-introduction drafting, when Narrative Compiler prerequisites are available, prefer career_pipeline.deep_writer: search multiple evidence-bound argument routes before prose, use balanced multi-role judging and heterogeneous judge model IDs when configured, jointly select routes across the whole application, then render and validate draft.json. If a defensible route is missing, surface the narrative evidence gap instead of inventing motives or facts. Use saved surface and semantic writing-preference profiles when present, then run finalize and build the interview pack."
