interface:
  display_name: "Career Pipeline"
  short_description: "근거권한→리서치→증거포트폴리오→신뢰판정→주장검증→보정형면접→지원자동화"
  default_prompt: "Use $career-pipeline as an Evidence-to-Signal Compiler, not as a prompt-only writer. Prefer career_pipeline.golden_path_converged start/resume as the default V2 workflow; direct legacy prepare/finalize/audit commands are compatibility paths and must not bypass current contracts. Preserve confirmed-experience, posting/matching, Research Intelligence, Narrative Compiler, Integrated Writer/Deep Writer, validation/finalize, legacy interview-pack, Assertion Compiler, structured-adaptive Interview Intelligence, audit, and application-execution boundaries. Enforce Authority Conservation: downstream stages may never expand factual authority. Use career_pipeline.authority_contract as the canonical question-scoped applicant/research authority and metric contract. Require complete required-slot research coverage, zero unresolved conflicts, and verified 04_리서치실행.json before writing. Canonicalize the research pack from the same ledger/coverage/conflict state without inventing interpretation or dates. Before prose search, build 05_근거포트폴리오.json and use its Evidence × Job-Signal assignment only as planning guidance; it may pass authority IDs, coverage, reuse and defensibility signals but must never authorize new facts. Strategy priors, YouTube, history, preference learning, outcomes and the evidence portfolio are strategy/diagnostic only. In the default Golden Path, final prose selection must use the reliable score-schema selector: evaluate the same two valid prose candidates in AB/BA order, add a second rubric lens only when needed, record position flips/ties in 05_신뢰평가.json, and use a deterministic style/preference fallback when semantic evaluation is unstable rather than forcing a semantic winner. Before finalize, require strict legacy interview-pack validation and question-scoped metric checks; if the final draft changes while the pack does not, require refresh. After the final draft is stable, run the context-preserving Assertion Compiler and record supported_by, metrics, causal_scope, question_scope, contradictions and authority_status for every final assertion. Unsupported final assertions are an audit hard defect; missing lexical support or unverified causal scope stays review-required rather than becoming a fabricated contradiction. Then compile Interview Intelligence from confirmed authority, final references, target questions and aggregate weakness memory only. Standardized core questions always precede adaptive probes. Calibrate adaptive probe utility only from aggregate mock-interview diagnostic-yield observations, shrink sparse observations toward the structured prior, cap calibration influence, and store no raw prior answers or hiring probability. Running interview_intelligence evaluate --update-profile should update both aggregate weakness memory and aggregate diagnostic calibration; the next probe may use calibrated_expected_diagnostic_utility but this is explicitly not a psychometric information function. Deterministic fact/scope gates outrank semantic judges. For general pairwise judging use A/B and B/A position swap, rubric/role perturbation on ambiguity, explicit TIE/ABSTAIN and comparison-graph cycle detection; when consistency is insufficient return evaluation_uncertain instead of forcing a winner. Benchmark the system rather than only models: unsafe mutations must be detected and benign perturbations should preserve decisions. Never infer hiring/pass probability from judges, outcomes, interview diagnostics, calibration or benchmarks. Golden Path is complete only when final audit passes and internal_validation_score>=90; CI/regression failures mean the architecture is not ready for release."
