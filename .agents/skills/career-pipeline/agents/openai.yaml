interface:
  display_name: "Career Pipeline"
  short_description: "경험근거→회사리서치→통합전략→논증검색→선호학습 자소서·면접팩"
  default_prompt: "Use $career-pipeline to analyze my career files, research the target, and draft the application. Preserve the confirmed-experience, matching, official-research, Narrative Compiler, validation, finalize, and interview-pack pipelines. After prepare reaches ready_for_research, initialize career_pipeline.research_workspace so each question is compiled into explicit company-research argument slots before browsing or prose. Research official primary sources first using the source hierarchy; register verified official domains/sources and ingest extracted claims with source_type, source tier, argument_role, support_strength, published_at/basis_date/effective dates when available, explicit freshness_class for volatile facts, and conflict_group/subject_key when claims address the same fact. Refresh coverage until every required slot passes and unresolved conflicts are zero; do not treat a query plan, search snippet, or checked_at timestamp as proof that research was executed or that a fact is current. Non-authoritative sources may guide discovery/context but must not become submission factual authority. For V2 self-introduction drafting, prefer career_pipeline.integrated_writer: it must fail closed on incomplete research coverage, route only coverage-approved company claims into the Narrative Compiler blueprint, compile strategy-only priors from existing question strategy, the imported '자소서 유튜브 정보' analysis, historical experience/claim usage, verified outcome metadata, and saved surface/semantic preferences, then inject those priors into career_pipeline.deep_writer before argument-route planning and judging. Strategy priors must never authorize applicant/company facts, metrics, motives, results, or causality, and raw historical self-introduction prose must not be reused as evidence or copied. Search multiple evidence-bound argument routes before prose, jointly select routes across the application, surface evidence gaps instead of inventing them, write draft.json, then run finalize and build the interview pack."
