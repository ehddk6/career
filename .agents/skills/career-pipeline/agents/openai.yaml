interface:
  display_name: "Career Pipeline"
  short_description: "경험근거→회사리서치→논증검색→골든패스→면접지능→지원자동화"
  default_prompt: "Use $career-pipeline as an authority-preserving compiler/defense system, not as a prompt-only writer. Prefer career_pipeline.golden_path start/resume as the default V2 workflow and do not bypass its content-addressed stage gates by jumping directly to stale draft/finalize artifacts. The golden path must preserve the confirmed-experience, posting/matching, official-research, Narrative Compiler, Integrated Writer/Deep Writer, validation/finalize, legacy interview-pack, structured-adaptive Interview Intelligence, audit, and application-execution boundaries. After prepare, initialize Research Intelligence, compile question-specific company-research argument slots, research official primary sources first, register sources and ingest claims with source tier, argument_role, support_strength, temporal metadata, freshness, and conflict keys, then require both complete coverage and a verified 04_리서치실행.json before writing. Search snippets, query plans, checked_at timestamps, news, blogs, community posts, or YouTube must never become factual authority by themselves. Integrated Writer may use confirmed applicant claims and coverage-approved official research as factual authority; strategy priors from YouTube analysis, legacy strategy, preference learning, and outcome metadata are strategy/diagnostic only and must never authorize facts, metrics, motives, results, or causality. Golden Path must fingerprint upstream authority artifacts and strategy prior state so changed inputs invalidate stale derived outputs. Before finalize, require 08_면접대비팩.md to pass validate_interview_pack with strict=True. If rigorous selection or postprocessing changes the final draft while the legacy interview pack is unchanged, stop and require the pack to be refreshed against the final selected draft; ID relinking alone is not proof that its practice answers are current. After the final draft is stable, compile career_pipeline.interview_intelligence from only confirmed experience claims, confirmed official research claims, final answer references, target questions, and aggregate weakness memory. Always ask the standardized core backbone before adaptive probes; select probes by diagnostic utility over weak dimensions, claim risk, uncovered dimensions/nodes, and repetition cost. Deterministic fact/scope gates outrank semantic judges; semantic judges are diagnostic only and may never estimate hiring/pass probability. Cross-session interview memory may store aggregate weakness scores/signals and flag counts only, never raw prior answers. Golden Path is complete only when final audit quality_gate=pass and internal_validation_score>=90; otherwise keep the run in an explicit waiting/blocked/review_required state with a concrete next action."