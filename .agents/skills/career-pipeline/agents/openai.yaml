interface:
  display_name: "Career Pipeline"
  short_description: "경험근거→통합전략→논증검색→선호학습 자소서·면접팩"
  default_prompt: "Use $career-pipeline to analyze my career files, research the target, and draft the application. Preserve the existing confirmed-experience, matching, official-research, Narrative Compiler, validation, finalize, and interview-pack pipelines. For V2 self-introduction drafting, prefer career_pipeline.integrated_writer: compile strategy-only priors from existing question strategy, the imported '자소서 유튜브 정보' analysis, historical experience/claim usage, verified outcome metadata, and saved surface/semantic preferences; then inject those priors into career_pipeline.deep_writer before argument-route planning and judging. Strategy priors must never authorize applicant/company facts, metrics, motives, results, or causality, and raw historical self-introduction prose must not be reused as evidence or copied. Search multiple evidence-bound argument routes before prose, jointly select routes across the application, surface evidence gaps instead of inventing them, write draft.json, then run finalize and build the interview pack."
